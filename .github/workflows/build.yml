name: Stable EDK2 OVMF Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'trunk'
  schedule:
    - cron: '0 0 * * *'

jobs:
  check:
    # On scheduled runs, bail out unless upstream has published a newer stable
    # than the one our last GitHub release was built from. Push and dispatch
    # runs skip this job entirely (so manual builds always happen).
    name: Check for new EDK2 stable
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - name: Compare upstream tag to last release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LATEST=$(git ls-remote --tags --refs https://github.com/tianocore/edk2.git 'edk2-stable*' \
              | awk -F/ '{print $NF}' \
              | grep -E '^edk2-stable[0-9]{6}$' \
              | sort -V \
              | tail -1)
          if [ -z "$LATEST" ]; then
              echo "Could not resolve latest edk2 stable tag" >&2
              exit 1
          fi
          LAST_BUILT=""
          if BODY=$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null); then
              LAST_BUILT=$(printf '%s' "$BODY" | grep -oE 'edk2-stable[0-9]{6}' | head -1 || true)
          fi
          echo "Upstream latest: $LATEST"
          echo "Last built:      ${LAST_BUILT:-<none>}"
          if [ "$LATEST" = "$LAST_BUILT" ]; then
              echo "No new EDK2 stable; skipping build"
              echo "new_version=false" >> $GITHUB_OUTPUT
          else
              echo "new_version=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Stable EDK2 OVMF Build
    needs: [check]
    if: always() && (github.event_name != 'schedule' || needs.check.outputs.new_version == 'true')
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: pacman --noconfirm -Syu && pacman --needed --noconfirm -S base-devel git wget python acpica nasm

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Git config
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rebuild
        run: |
          set -ex

          GCC_VERSION=16.2.0

          for i in aarch64 i386 loongarch64 riscv64 x86_64; do
              wget https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/$GCC_VERSION/x86_64-gcc-$GCC_VERSION-nolibc-$i-linux.tar.gz
              tar -xf x86_64-gcc-$GCC_VERSION-nolibc-$i-linux.tar.gz
              export PATH="$(pwd -P)"/gcc-$GCC_VERSION-nolibc/$i-linux/bin:"$PATH"
          done

          # Resolve the newest edk2-stableYYYYMM tag from upstream. The strict
          # regex filters out rc tags (edk2-stableYYYYMM-rcN) so we never ship
          # a release candidate as if it were the latest stable.
          EDK2_STABLE_TAG=$(git ls-remote --tags --refs https://github.com/tianocore/edk2.git 'edk2-stable*' \
              | awk -F/ '{print $NF}' \
              | grep -E '^edk2-stable[0-9]{6}$' \
              | sort -V \
              | tail -1)
          if [ -z "$EDK2_STABLE_TAG" ]; then
              echo "Could not resolve latest edk2 stable tag" >&2
              exit 1
          fi
          echo "Building EDK2 stable tag: $EDK2_STABLE_TAG"
          echo "EDK2_STABLE_TAG=$EDK2_STABLE_TAG" >> $GITHUB_ENV

          git clone --recursive --depth=1 --branch "$EDK2_STABLE_TAG" https://github.com/tianocore/edk2.git

          ( cd edk2 && patch -p1 <../ovmf.patch )
          # Restores OvmfPkgIa32, deleted upstream in 1fb88ffe2.
          ( cd edk2 && patch -p1 <../ovmf-ia32.patch )

          export PACKAGES_PATH="$(pwd -P)"/edk2

          export GCC_AARCH64_PREFIX=aarch64-linux-
          export GCC_LOONGARCH64_PREFIX=loongarch64-linux-
          export GCC_RISCV64_PREFIX=riscv64-linux-

          # EDK2 has no GCC_X64_PREFIX/GCC_IA32_PREFIX environment hook: its
          # tools_def.template resolves the native (IA32/X64) tool paths from
          # ENV(GCC_BIN) instead, which defaults to empty and therefore picks
          # up the host gcc. It is plain string concatenation, so a target
          # triple prefix works there just like the cross-arch variables above.
          # The one variable covers both native arches, so the IA32 build
          # overrides it on its own command line.
          export GCC_BIN=x86_64-linux-

          set +e
          . edk2/edksetup.sh
          set -e
          make -C edk2/BaseTools

          mkdir -p output

          # Each platform is built twice into the same Build directory, so
          # each image is copied out before its Secure Boot counterpart is
          # built over it. On x86, Secure Boot takes the 4MB flash layout,
          # whose variable store has room for authenticated variables, and
          # SMM, without which OVMF refuses to keep Secure Boot variables in
          # flash. The Secure Boot image also has TPM 2.0 support. RISC-V
          # boots through PEI like the other platforms, which is also the
          # only path on which it probes for a TPM.

          build -b RELEASE -t GCC -a AARCH64 -p ArmVirtPkg/ArmVirtQemu.dsc
          cp Build/ArmVirtQemu-AArch64/RELEASE_GCC/FV/QEMU_EFI.fd  output/ovmf-code-aarch64.fd
          cp Build/ArmVirtQemu-AArch64/RELEASE_GCC/FV/QEMU_VARS.fd output/ovmf-vars-aarch64.fd
          build -b RELEASE -t GCC -a AARCH64 -p ArmVirtPkg/ArmVirtQemu.dsc -D SECURE_BOOT_ENABLE=TRUE -D TPM2_ENABLE=TRUE -D TPM2_CONFIG_ENABLE=TRUE
          cp Build/ArmVirtQemu-AArch64/RELEASE_GCC/FV/QEMU_EFI.fd  output/ovmf-code-aarch64-secboot.fd
          cp Build/ArmVirtQemu-AArch64/RELEASE_GCC/FV/QEMU_VARS.fd output/ovmf-vars-aarch64-secboot.fd

          build -b RELEASE -t GCC -a LOONGARCH64 -p OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc
          cp Build/LoongArchVirtQemu/RELEASE_GCC/FV/QEMU_EFI.fd  output/ovmf-code-loongarch64.fd
          cp Build/LoongArchVirtQemu/RELEASE_GCC/FV/QEMU_VARS.fd output/ovmf-vars-loongarch64.fd
          build -b RELEASE -t GCC -a LOONGARCH64 -p OvmfPkg/LoongArchVirt/LoongArchVirtQemu.dsc -D SECURE_BOOT_ENABLE=TRUE -D TPM2_ENABLE=TRUE -D TPM2_CONFIG_ENABLE=TRUE
          cp Build/LoongArchVirtQemu/RELEASE_GCC/FV/QEMU_EFI.fd  output/ovmf-code-loongarch64-secboot.fd
          cp Build/LoongArchVirtQemu/RELEASE_GCC/FV/QEMU_VARS.fd output/ovmf-vars-loongarch64-secboot.fd

          build -b RELEASE -t GCC -a RISCV64 -p OvmfPkg/RiscVVirt/RiscVVirtQemu.dsc -D RISCVVIRT_PEI_BOOTING=TRUE
          cp Build/RiscVVirtQemu/RELEASE_GCC/FV/RISCV_VIRT_CODE.fd output/ovmf-code-riscv64.fd
          cp Build/RiscVVirtQemu/RELEASE_GCC/FV/RISCV_VIRT_VARS.fd output/ovmf-vars-riscv64.fd
          build -b RELEASE -t GCC -a RISCV64 -p OvmfPkg/RiscVVirt/RiscVVirtQemu.dsc -D SECURE_BOOT_ENABLE=TRUE -D RISCVVIRT_PEI_BOOTING=TRUE -D TPM2_ENABLE=TRUE -D TPM2_CONFIG_ENABLE=TRUE
          cp Build/RiscVVirtQemu/RELEASE_GCC/FV/RISCV_VIRT_CODE.fd output/ovmf-code-riscv64-secboot.fd
          cp Build/RiscVVirtQemu/RELEASE_GCC/FV/RISCV_VIRT_VARS.fd output/ovmf-vars-riscv64-secboot.fd

          build -b RELEASE -t GCC -a X64 -p OvmfPkg/OvmfPkgX64.dsc -D FD_SIZE_2MB
          cp Build/OvmfX64/RELEASE_GCC/FV/OVMF_CODE.fd output/ovmf-code-x86_64.fd
          cp Build/OvmfX64/RELEASE_GCC/FV/OVMF_VARS.fd output/ovmf-vars-x86_64.fd
          build -b RELEASE -t GCC -a X64 -p OvmfPkg/OvmfPkgX64.dsc -D FD_SIZE_4MB -D SECURE_BOOT_ENABLE=TRUE -D SMM_REQUIRE=TRUE -D TPM2_ENABLE=TRUE
          cp Build/OvmfX64/RELEASE_GCC/FV/OVMF_CODE.fd output/ovmf-code-x86_64-secboot.fd
          cp Build/OvmfX64/RELEASE_GCC/FV/OVMF_VARS.fd output/ovmf-vars-x86_64-secboot.fd

          GCC_BIN=i386-linux- build -b RELEASE -t GCC -a IA32 -p OvmfPkg/OvmfPkgIa32.dsc -D FD_SIZE_2MB
          cp Build/OvmfIa32/RELEASE_GCC/FV/OVMF_CODE.fd output/ovmf-code-ia32.fd
          cp Build/OvmfIa32/RELEASE_GCC/FV/OVMF_VARS.fd output/ovmf-vars-ia32.fd
          GCC_BIN=i386-linux- build -b RELEASE -t GCC -a IA32 -p OvmfPkg/OvmfPkgIa32.dsc -D FD_SIZE_4MB -D SECURE_BOOT_ENABLE=TRUE -D SMM_REQUIRE=TRUE -D TPM2_ENABLE=TRUE
          cp Build/OvmfIa32/RELEASE_GCC/FV/OVMF_CODE.fd output/ovmf-code-ia32-secboot.fd
          cp Build/OvmfIa32/RELEASE_GCC/FV/OVMF_VARS.fd output/ovmf-vars-ia32-secboot.fd


      - name: Set TAG_DATE variable
        run: echo "TAG_DATE=$(date -u +'%Y%m%dT%H%M%SZ')" >> $GITHUB_ENV

      - name: Rename output directory
        run: mv output edk2-ovmf-bins

      - name: Create release tarball
        run: |
          set -e
          for f in ovmf-code-aarch64 ovmf-vars-aarch64 ovmf-code-aarch64-secboot ovmf-vars-aarch64-secboot; do
              dd if=/dev/zero of=edk2-ovmf-bins/$f.fd bs=1 count=0 seek=67108864
          done
          for f in ovmf-code-riscv64 ovmf-vars-riscv64 ovmf-code-riscv64-secboot ovmf-vars-riscv64-secboot; do
              dd if=/dev/zero of=edk2-ovmf-bins/$f.fd bs=1 count=0 seek=33554432
          done
          tar -zcvf edk2-ovmf-bins.tar.gz edk2-ovmf-bins
          tar -Jcvf edk2-ovmf-bins.tar.xz edk2-ovmf-bins

      - name: Tag new release
        run: git tag $TAG_DATE && git push --tags

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.EDK2_STABLE_TAG }} (${{ env.TAG_DATE }})
          tag_name: ${{ env.TAG_DATE }}
          body: Binary images of EDK2 OVMF of upstream release `${{ env.EDK2_STABLE_TAG }}`.
          files: |
            edk2-ovmf-bins.tar.gz
            edk2-ovmf-bins.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
